# Perf gate for `08-performance-budgets.md` (roadmap item 6).
#
# PR/push `gate`: unit tests (incl. non-vacuous gate-enforcement tests) +
# release `ghostline bench --gate` against doc budgets. Fails the run on
# any budget violation. bench.json uploaded for dashboarding.
#
# `nightly-matrix`: weekly + manual; 50k seed on ubuntu/macos.
# `bench-500k`: weekly + manual; the review's full 500k-row query gate on
# ubuntu (rare search, 1-2 char search, suggest, hook, plans).
# Deferred (not in v1 slice): hyperfine hook-overhead comparison,
# expect/tmux E2E prompt harness, NFS/container matrix.
name: perf

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: bench gate (doc budgets)
        run: |
          set -o pipefail
          ./target/release/ghostline bench --n 10000 --reps 20 --json --gate | tee bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ubuntu
          path: bench.json

  bench-500k:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: bench gate (500k rows)
        run: |
          set -o pipefail
          ./target/release/ghostline bench --n 500000 --reps 20 --json --gate | tee bench-500k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-500k
          path: bench-500k.json

  nightly-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: bench gate (larger seed)
        run: |
          set -o pipefail
          ./target/release/ghostline bench --n 50000 --reps 20 --json --gate | tee bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-nightly-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
